<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sampling temperature and biased consensus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  .sp {
    --ink: #10202c; --muted: #6a7985; --rule: #dfe7ed;
    --night: #0e1b27; --plus: #5e4fa2; --minus: #9e0142;
    --serif: "Fraunces", Georgia, serif; --sans: "Source Sans 3", system-ui, sans-serif;
    font-family: var(--sans); color: var(--ink); max-width: 920px; margin: 0 auto; font-size: 17px; line-height: 1.4;
  }
  .sp * { box-sizing: border-box; }

  .sp-title { font-family: var(--serif); font-weight: 300; font-size: 30px; letter-spacing: -0.01em; margin: 0 0 18px; }
  .sp-title em { font-style: italic; }

  .sp-ctl { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 10px 22px; margin-bottom: 18px; }
  .sp-ctl label { font-size: 17px; color: var(--muted); white-space: nowrap; }
  .sp-slide { display: flex; flex-direction: column; gap: 6px; }
  .sp-ctl .val { font-family: var(--serif); font-weight: 500; font-size: 22px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; min-width: 2.3em; text-align: right; }
  .sp-range { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 999px; outline: none; margin: 0; cursor: pointer;
    background: var(--rule); }
  .sp-range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); cursor: grab; box-shadow: 0 1px 4px rgba(16,32,44,.25); }
  .sp-range::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); cursor: grab; }
  .sp-range:focus-visible { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--minus); }
  .sp-ticks { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); padding: 0 4px; }
  .sp-net { display: flex; align-items: center; gap: 8px; margin: -6px 0 14px; font-size: 17px; color: var(--muted); }
  .sp-net span { margin-right: 6px; }
  .sp-net button { font: inherit; font-size: 17px; color: var(--ink); background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .sp-net button:hover { border-color: var(--ink); }
  .sp-net button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .sp-net button:focus-visible { outline: 2px solid var(--minus); outline-offset: 2px; }
  .sp-btns { display: flex; gap: 8px; }
  .sp-btns button { font: inherit; font-size: 17px; color: var(--ink); background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  .sp-btns button:hover { border-color: var(--ink); }
  .sp-btns button:disabled { color: var(--muted); border-color: var(--rule); cursor: default; }
  .sp-btns button:focus-visible { outline: 2px solid var(--minus); outline-offset: 2px; }
  .sp-btns #sp-again { background: var(--ink); color: #fff; border-color: var(--ink); }
  @media (max-width: 700px) { .sp-ctl { grid-template-columns: 1fr auto; } .sp-ctl label { grid-column: 1 / -1; } .sp-btns { grid-column: 1 / -1; justify-content: flex-end; } }

  .sp-body { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 26px; align-items: center; }
  @media (max-width: 640px) { .sp-body { grid-template-columns: 1fr; } .sp-ctl { grid-template-columns: 1fr auto; } .sp-ctl label { grid-column: 1 / -1; } .sp-ticks { grid-column: 1; } }

  .sp-lattice { padding: 6px; aspect-ratio: 1 / 1; }
  .sp-lattice svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .sp-spin { transition: transform .5s cubic-bezier(.4, 0, .2, 1); }
  .sp-spin .sh, .sp-spin .hd { fill-opacity: 0.8; }
  .sp-spin.up { transform: rotate(0deg); } .sp-spin.down { transform: rotate(180deg); }

  .sp-plot { display: flex; flex-direction: column; min-height: 340px; }
  .sp-plot svg { display: block; width: 100%; flex: 1; }

  .sp-foot { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 26px; margin-top: 4px; font-size: 17px; color: var(--muted); }
    @media (max-width: 640px) { .sp-foot { grid-template-columns: 1fr; } .sp-leg, .sp-avg { text-align: center; } }
  .sp-foot .m { font-family: var(--serif); font-weight: 500; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; margin-left: 2px; }
  .sp-foot b { color: var(--ink); font-weight: 600; }
  .sp-leg { white-space: nowrap; text-align: center; font-size: 18px; color: var(--ink); }
  .sp-leg .sp-ramp { display: inline-block; width: 150px; height: 13px; border-radius: 999px; vertical-align: -1px; margin: 0 12px; background: linear-gradient(270deg, #9e0142, #d53e4f, #f46d43, #fdae61, #fee08b, #ffffbf, #e6f598, #abdda4, #66c2a5, #3288bd, #5e4fa2); }
  .sp-avg { white-space: nowrap; text-align: right; }

  @media (prefers-reduced-motion: reduce) { .sp-spin { transition: none; } }
</style>
</head>
<body>
<figure class="sp" id="sp" style="margin:0">

  <div class="sp-ctl">
    <label for="sp-T">sampling temperature</label>
    <div class="sp-slide">
      <input class="sp-range" id="sp-T" type="range" min="0.05" max="1.5" step="0.01" value="0.9" aria-label="sampling temperature">
      <div class="sp-ticks"><span>0</span><span>0.5</span><span>1.0</span><span>1.5</span></div>
    </div>
    <div class="val" id="sp-Tv">0.90</div>
    <div class="sp-btns"><button type="button" id="sp-run">Pause</button><button type="button" id="sp-again">Run again</button></div>
  </div>

  <div class="sp-net"><span>each agent chats with</span><button type="button" class="on" data-k="lattice">neighbors</button><button type="button" data-k="ring">everyone</button></div>

  <div class="sp-body">
    <div class="sp-lattice">
      <svg id="sp-grid" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-label="36 agents drawn as spins; up is dog (+1), down is cat (−1)">
        <defs>
        </defs>
      </svg>
    </div>
    <div class="sp-plot">
      <svg id="sp-chart" viewBox="0 0 460 300" aria-label="Every agent's lean over the last 80 rounds, with the group average in bold"></svg>
    </div>
  </div>

  <figcaption class="sp-foot">
    <span class="sp-leg">dog +1 <i class="sp-ramp"></i> −1 cat</span>
    <span class="sp-avg">round <b id="sp-round">0</b> / 30 · group average <span class="m" id="sp-m">+0.00</span></span>
  </figcaption>
</figure>

<script>
(function () {
  const $ = id => document.getElementById(id);
  let N = 36; const COLS = 6, R = 30, MS = 170;
  let layoutNow = 'lattice';  // 'lattice': 4 nearest neighbors (textbook Ising) · 'ring': everyone sees everyone
  let K = 4;                  // peers per agent: 4 on the lattice, N−1 on the ring
  let LAM = 1 / K;            // conformity scaled so λ·K = 1
  const GAM = 0.26, TILT_FRAC = 0.7;   // 70% of agents carry a small tilt toward +1; the rest are neutral
  let tilt;                              // per-agent tilt, GAM or 0
  let T = 0.9, rand, sigma, lean, hist, mhist, nbrs, timer;

  // slider: Spectral over T
  const SPEC = ['#5e4fa2','#3288bd','#66c2a5','#abdda4','#e6f598','#ffffbf','#fee08b','#fdae61','#f46d43','#d53e4f','#9e0142'].map(h => [1,3,5].map(k => parseInt(h.slice(k, k + 2), 16)));
  // spins and group average: cool over the value, −1 cyan … +1 magenta
  const COOL = ['#00e0e0','#33c2f0','#66a3ff','#9985ff','#cc66ff','#ff33ff','#ff00ff'].map(h => [1,3,5].map(k => parseInt(h.slice(k, k + 2), 16)));
  function ramp(stops, u, maxLum) { u = Math.min(1, Math.max(0, u)) * (stops.length - 1); const k = Math.min(stops.length - 2, Math.floor(u)), f = u - k; const raw = stops[k].map((v, j) => v + (stops[k + 1][j] - v) * f); const lum = 0.299 * raw[0] + 0.587 * raw[1] + 0.114 * raw[2]; const sc = Math.min(1, maxLum / lum); return `rgb(${raw.map(v => Math.round(v * sc)).join(',')})`; }
  const spectralInk = T => ramp(SPEC, (T - 0.05) / 1.45, 120);
  const valueColor = m => ramp(SPEC, (1 - m) / 2, 999);   // matplotlib Spectral: low = red, high = blue   // true Spectral, yellow in the middle
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const grid = $('sp-grid'), spins = []; let shown, flips;
  // perspective camera: lattice in the x–z plane, y up
  function camera({ cx, cy, f, dist, pitch, yaw }) {
    const cy_ = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    return (x, y, z) => { const X = x * cy_ - z * sy, Z0 = x * sy + z * cy_; const Y = y * cp + Z0 * sp, Z = -y * sp + Z0 * cp + dist; const s = f / Z; return [cx + X * s, cy - Y * s, s]; };
  }
  const half = (COLS - 1) / 2;
  const P = camera({ cx: 50, cy: 50, f: 122, dist: 9.4, pitch: 0.6, yaw: 0.5 });
  const LN = 'stroke="#aab8c5" stroke-width="0.55"';
  function latticeSites() { return [...Array(N).keys()].map(i => ({ i, x: (i % COLS) - half, z: Math.floor(i / COLS) - half })); }
  function ringSites() {   // one ring of N agents
    return [...Array(N).keys()].map(i => { const th = Math.PI * 2 * i / N + 0.2, r = 2.6; return { i, x: r * Math.cos(th), z: r * Math.sin(th) }; });
  }
  function buildScene(layout) {
    layoutNow = layout; N = layout === 'ring' ? 20 : 36; K = layout === 'ring' ? N - 1 : 4; LAM = 1 / K; shown = new Int8Array(N); flips = new Array(N).fill(null); spins.length = 0;
    grid.innerHTML = '';
    const raw = layout === 'ring' ? ringSites() : latticeSites();
    const sites = raw.map(st => ({ ...st, b: P(st.x, 0, st.z), t: P(st.x, 1.0, st.z) })).sort((p, q) => p.b[2] - q.b[2]);
    let floor = '';
    if (layout === 'ring') {
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) { const a = sites.find(s => s.i === i).b, b = sites.find(s => s.i === j).b; floor += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#aab8c5" stroke-width="0.4" stroke-opacity="0.22"/>`; }
    } else {
      for (let g = 0; g < COLS; g++) {
        const a1 = P(g - half, 0, -half), a2 = P(g - half, 0, half), c1 = P(-half, 0, g - half), c2 = P(half, 0, g - half);
        floor += `<line x1="${a1[0]}" y1="${a1[1]}" x2="${a2[0]}" y2="${a2[1]}" ${LN}/><line x1="${c1[0]}" y1="${c1[1]}" x2="${c2[0]}" y2="${c2[1]}" ${LN}/>`;
      }
    }
    grid.insertAdjacentHTML('beforeend', `<g>${floor}</g>`);
    grid.insertAdjacentHTML('beforeend', `<g>${sites.map(st => `<circle cx="${st.b[0]}" cy="${st.b[1]}" r="${0.07 * st.b[2]}" fill="#9fb2c2"/>`).join('')}</g>`);
    for (const st of sites) {
      const [bx, by, s] = st.b, [tx, ty] = st.t;
      const w = 0.1 * s, hw = 0.19 * s, hl = 0.27 * s;
      const dx = tx - bx, dy = ty - by, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
      const hf = L * 0.5, sx = bx - ux * hf, sy = by - uy * hf, ex = bx + ux * hf, ey = by + uy * hf;   // centered on the site
      const hx = ex - ux * hl, hy = ey - uy * hl;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'sp-spin up');
      g.style.transformOrigin = `${bx}px ${by}px`; g.style.transformBox = 'view-box';
      g.innerHTML = `<polygon class="sh" points="${sx + nx * w / 2},${sy + ny * w / 2} ${hx + nx * w / 2},${hy + ny * w / 2} ${hx - nx * w / 2},${hy - ny * w / 2} ${sx - nx * w / 2},${sy - ny * w / 2}"/>`
        + `<polygon class="hd" points="${ex},${ey} ${hx + nx * hw},${hy + ny * hw} ${hx - nx * hw},${hy - ny * hw}"/>`;
      grid.appendChild(g); spins[st.i] = g;
    }
  }
  buildScene('lattice');

  function field(i) { let s = 0; for (const j of nbrs[i]) s += sigma[j]; return LAM * s + tilt[i] / 2; }
  function mean() { let s = 0; for (let i = 0; i < N; i++) s += sigma[i]; return s / N; }

  function reset() {
    rand = mulberry32(67);
    // round 0: each agent answers alone, with only its own small tilt
    tilt = new Float32Array(N); { const idx = [...Array(N).keys()]; for (let k = N - 1; k > 0; k--) { const r = Math.floor(rand() * (k + 1)); [idx[k], idx[r]] = [idx[r], idx[k]]; } for (let k = 0; k < Math.round(TILT_FRAC * N); k++) tilt[idx[k]] = GAM; }
    sigma = new Int8Array(N); for (let i = 0; i < N; i++) { const p0 = 0.5 * (1 + Math.tanh((tilt[i] / 2) / T)); sigma[i] = rand() < p0 ? 1 : -1; }
    nbrs = [];
    if (layoutNow === 'lattice') {   // textbook Ising: nearest neighbors on the grid, open boundaries
      for (let i = 0; i < N; i++) { const c = i % COLS, r = Math.floor(i / COLS), nb = []; if (c > 0) nb.push(i - 1); if (c < COLS - 1) nb.push(i + 1); if (r > 0) nb.push(i - COLS); if (r < COLS - 1) nb.push(i + COLS); nbrs.push(nb); }
    } else {                          // everyone sees everyone
      for (let i = 0; i < N; i++) nbrs.push([...Array(N).keys()].filter(j => j !== i));
    }
    lean = Array.from({ length: N }, (_, i) => Math.tanh(field(i) / T));
    hist = lean.map(v => [v]); mhist = [mean()];
    for (let i = 0; i < N; i++) { shown[i] = sigma[i]; flips[i] = null; }
    paint(); draw();
  }

  function step() {
    for (let u = 0; u < N; u++) {
      const i = Math.floor(rand() * N);
      const p = 0.5 * (1 + Math.tanh(field(i) / T));
      sigma[i] = rand() < p ? 1 : -1;
    }
    for (let i = 0; i < N; i++) { lean[i] = Math.tanh(field(i) / T); hist[i].push(lean[i]); }
    mhist.push(mean());
    paint(); draw();
  }

  let raf = null;
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  function tint(now) {
    let busy = false;
    for (let i = 0; i < N; i++) {
      let v = shown[i];
      if (flips[i]) { const t = Math.min(1, (now - flips[i].t0) / (reduce ? 1 : 500)); v = flips[i].from + (flips[i].to - flips[i].from) * ease(t); if (t < 1) busy = true; else flips[i] = null; }
      const col = valueColor(v * 0.8);   // ±0.8 → the clear red / blue of Spectral, not its dark ends
      for (const el of spins[i].querySelectorAll('.sh,.hd')) el.setAttribute('fill', col);
    }
    raf = busy ? requestAnimationFrame(tint) : null;
  }
  function paint() {
    const now = performance.now();
    for (let i = 0; i < N; i++) {
      const up = sigma[i] > 0;
      if (shown[i] !== sigma[i]) { flips[i] = { t0: now, from: shown[i], to: sigma[i] }; shown[i] = sigma[i]; }
      spins[i].setAttribute('class', 'sp-spin ' + (up ? 'up' : 'down'));
    }
    if (!raf) raf = requestAnimationFrame(tint);
    $('sp-round').textContent = mhist.length - 1;
    const m = mhist[mhist.length - 1];
    $('sp-m').textContent = (m >= 0 ? '+' : '−') + Math.abs(m).toFixed(2); $('sp-m').style.color = valueColor(m);
  }

  function draw() {
    const W = 460, H = 300, L = 48, Rr = 16, Tp = 20, B = 42;
    const n = mhist.length;
    const x = r => L + r / R * (W - L - Rr), y = v => Tp + (1 - v) / 2 * (H - Tp - B);
    const F = 'font-family="Source Sans 3, system-ui, sans-serif" font-size="17" fill="#6a7985"';
    let o = '';
    o += `<line x1="${L}" y1="${y(1)}" x2="${W - Rr}" y2="${y(1)}" stroke="#eaf0f4"/>`;
    o += `<line x1="${L}" y1="${y(-1)}" x2="${W - Rr}" y2="${y(-1)}" stroke="#eaf0f4"/>`;
    o += `<line x1="${L}" y1="${y(0)}" x2="${W - Rr}" y2="${y(0)}" stroke="#cbd7e0"/>`;
    for (const [v, t] of [[1, '+1'], [0, '0'], [-1, '−1']]) o += `<text x="${L - 9}" y="${y(v) + 5}" text-anchor="end" ${F}>${t}</text>`;
    o += `<text x="${L}" y="${H - 10}" ${F}>round 0</text><text x="${W - Rr}" y="${H - 10}" text-anchor="end" ${F}>${R}</text>`;
    for (let i = 0; i < N; i++) {
      for (let r = 1; r < n; r++) {
        const v = (hist[i][r - 1] + hist[i][r]) / 2;
        o += `<line x1="${x(r - 1).toFixed(1)}" y1="${y(hist[i][r - 1]).toFixed(1)}" x2="${x(r).toFixed(1)}" y2="${y(hist[i][r]).toFixed(1)}" stroke="${valueColor(v)}" stroke-opacity="0.3" stroke-width="1.3" stroke-linecap="round"/>`;
      }
    }
    for (let r = 1; r < n; r++) {
      const mm = (mhist[r - 1] + mhist[r]) / 2;
      o += `<line x1="${x(r - 1).toFixed(1)}" y1="${y(mhist[r - 1]).toFixed(1)}" x2="${x(r).toFixed(1)}" y2="${y(mhist[r]).toFixed(1)}" stroke="${valueColor(mm)}" stroke-width="3.2" stroke-linecap="round"/>`;
    }
    o += `<circle cx="${x(n - 1)}" cy="${y(mhist[n - 1])}" r="5.5" fill="${valueColor(mhist[n - 1])}"/>`;
    $('sp-chart').innerHTML = o;
  }

  const slider = $('sp-T'), runBtn = $('sp-run');
  function setT() { T = parseFloat(slider.value); $('sp-Tv').textContent = T.toFixed(2);  }
  function tick() { if (mhist.length - 1 >= R) { stop(); runBtn.textContent = 'Done'; runBtn.disabled = true; } else step(); }
  function start() { clearInterval(timer); runBtn.disabled = false; timer = setInterval(tick, MS); runBtn.textContent = 'Pause'; }
  function stop() { clearInterval(timer); timer = null; runBtn.textContent = 'Resume'; }
  function runAgain() { stop(); reset(); if (reduce) { while (mhist.length - 1 < R) step(); runBtn.textContent = 'Done'; runBtn.disabled = true; } else start(); }
  let pending;
  slider.addEventListener('input', () => { setT(); clearTimeout(pending); pending = setTimeout(runAgain, 250); });
  runBtn.addEventListener('click', () => timer ? stop() : start());
  $('sp-again').addEventListener('click', runAgain);
  document.querySelectorAll('.sp-net button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.sp-net button').forEach(x => x.classList.toggle('on', x === b));
    buildScene(b.dataset.k === 'lattice' ? 'lattice' : 'ring'); runAgain();
  }));
  setT(); runAgain();
})();
</script>
</body>
</html>
