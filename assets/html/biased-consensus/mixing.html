<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script>MathJax = { tex:{ displayMath:[["$$","$$"]] }, output:{ font:"mathjax-stix2" } };</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script>
<style>
  body { margin:0; background:#fff; }
  .mx { font-family:"Source Sans 3",system-ui,sans-serif; color:#10202c; max-width:920px; margin:0 auto; font-size:19px; line-height:1.4; }
  .mx * { box-sizing:border-box; }
  .mx-eq { text-align:center; margin:0 0 6px; }
  .mx-eq mjx-container { font-size:1.12em !important; margin:0 !important; }
  .mx-eq .A { color:#3288bd; } .mx-eq .B { color:#2a9d78; } .mx-eq .C { color:#c2602b; }
  .mx-sub { text-align:center; font-size:19px; color:#6a7985; margin:0 0 18px; }
  .mx-sub b { font-weight:600; }
  .mx svg { display:block; width:100%; max-width:540px; height:auto; margin:0 auto; }
</style></head>
<body>
<figure class="mx" id="mx" style="margin:0">
  <div class="mx-eq" id="mx-eq">$$ m(t+1)\;=\;\tfrac12\,\textcolor{#3288bd}{\tanh\Bigg(\frac{\lambda_{A}\,\rho N\, m(t)+\gamma/2}{T}\Bigg)}\;+\;\tfrac12\,\textcolor{#c2602b}{\tanh\Bigg(\frac{\lambda_{B}\,\rho N\, m(t)+\gamma/2}{T}\Bigg)} $$</div>
  <p class="mx-sub">two kinds of agent, half each: <b style="color:#3288bd">λ<sub>A</sub> = 1.6</b> (strongly conformist) and <b style="color:#c2602b">λ<sub>B</sub> = 0.4</b> (weakly conformist) · mean λ = 1.0</p>
  <svg id="mx-svg" viewBox="0 0 700 440" aria-label="Final consensus against shared bias for the two-model mixture and for a uniform population with the same average conformity"></svg>
</figure>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const LS = [1.6, 0.4], COLS = ['#3288bd', '#c2602b'], NAMES = ['all A', 'all B'];
  const lm = LS.reduce((a, b) => a + b, 0) / LS.length;
  const T0 = 0.7, Gmax = 0.6, NG = 120, Gs = Array.from({ length: NG + 1 }, (_, k) => 0.002 + (Gmax - 0.002) * k / NG);
  const CM = '#10202c', CH = '#8a9aa8';
  function fixedPos(f) { let best = null, prev = f(-1) + 1, xp = -1; for (let k = 1; k <= 3000; k++) { const x = -1 + 2 * k / 3000, v = f(x) - x; if (prev * v <= 0) { let a = xp, b = x; for (let i = 0; i < 36; i++) { const c = (a + b) / 2; if ((f(a) - a) * (f(c) - c) <= 0) b = c; else a = c; } best = (a + b) / 2; } prev = v; xp = x; } return best; }
  const resp = (l, gg) => m => Math.tanh((l * m + gg / 2) / T0);
  const mix = Gs.map(gg => fixedPos(m => LS.reduce((s, l) => s + resp(l, gg)(m) / LS.length, 0)));
  const hom = Gs.map(gg => fixedPos(resp(lm, gg)));
  const pure = LS.map(l => Gs.map(gg => fixedPos(resp(l, gg))));

  // the equation is static markup; MathJax typesets it with the page. If MathJax starts after the page loaded, typeset it when ready.
  (function tryTypeset(n) { if (window.MathJax && MathJax.typesetPromise) { if (!$('mx-eq').querySelector('mjx-container')) MathJax.typesetPromise([$('mx-eq')]); } else if (n < 100) setTimeout(() => tryTypeset(n + 1), 200); })(0);

  const W = 700, H = 440, L = 64, R = 185, Tp = 44, B = 60;
  const px = gg => L + gg / Gmax * (W - L - R), py = v => Tp + (1 - v) * (H - Tp - B);
  const F = 'font-family="Source Sans 3, system-ui, sans-serif" font-size="22" fill="#6a7985"';
  const path = (ys, col, width, dash, op = 1) => `<path d="${ys.map((v, k) => (k ? 'L' : 'M') + px(Gs[k]).toFixed(1) + ' ' + py(v).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-opacity="${op}" stroke-width="${width}" ${dash ? 'stroke-dasharray="8 6"' : ''} stroke-linecap="round" stroke-linejoin="round"/>`;
  let o = '';
  for (const v of [0, 0.5, 1]) o += `<line x1="${L}" y1="${py(v)}" x2="${W - R}" y2="${py(v)}" stroke="${v ? '#eaf0f4' : '#cbd7e0'}"/><text x="${L - 12}" y="${py(v) + 6}" text-anchor="end" ${F}>${v === 1 ? '+1' : v === 0 ? '0' : '0.5'}</text>`;
  for (const gg of [0, 0.2, 0.4, 0.6]) o += `<text x="${px(gg)}" y="${H - B + 26}" text-anchor="middle" ${F}>${gg.toFixed(1)}</text>`;
  o += `<text x="${(L + W - R) / 2}" y="${H - 10}" text-anchor="middle" ${F}>shared bias γ   (sampling temperature fixed at T = ${T0})</text>`;
  o += `<text x="${L}" y="${Tp - 18}" ${F}>final consensus m</text>`;
  // each kind alone, faint
  pure.forEach((ys, i) => { o += path(ys, COLS[i], 1.8, false, 0.45); });
  // the gap, then the two populations being compared
  const band = `M${mix.map((v, k) => px(Gs[k]).toFixed(1) + ' ' + py(v).toFixed(1)).join(' L')} L${hom.map((v, k) => px(Gs[NG - k]).toFixed(1) + ' ' + py(hom[NG - k]).toFixed(1)).join(' L')} Z`;
  o += `<path d="${band}" fill="#3288bd" fill-opacity="0.08"/>`;
  o += path(hom, CH, 2.6, true) + path(mix, CM, 3.6, false);
  // right-edge labels, stacked so they never overlap
  const labels = [
    ...pure.map((ys, i) => ({ y: py(ys[NG]), text: NAMES[i], col: COLS[i], w: 400, op: 0.85 })),
    { y: py(hom[NG]), text: 'uniform, λ = 1.0', col: CH, w: 600, op: 1 },
    { y: py(mix[NG]), text: 'half A, half B', col: CM, w: 600, op: 1 },
  ].sort((p, q) => p.y - q.y);
  for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 28) labels[i].y = labels[i - 1].y + 28;
  for (const l of labels) o += `<text x="${W - R + 10}" y="${l.y + 6}" font-family="Source Sans 3, system-ui, sans-serif" font-size="22" font-weight="${l.w}" fill="${l.col}" fill-opacity="${l.op}">${l.text}</text>`;
  // the gap at vanishing bias
  const x0 = px(Gs[0]);
  o += `<circle cx="${x0}" cy="${py(hom[0])}" r="6" fill="${CH}"/><circle cx="${x0}" cy="${py(mix[0])}" r="7" fill="${CM}" stroke="#fff" stroke-width="2"/>`;
  o += `<line x1="${x0 + 22}" y1="${py(hom[0])}" x2="${x0 + 22}" y2="${py(mix[0])}" stroke="#3288bd" stroke-width="2"/><line x1="${x0 + 16}" y1="${py(hom[0])}" x2="${x0 + 28}" y2="${py(hom[0])}" stroke="#3288bd" stroke-width="2"/><line x1="${x0 + 16}" y1="${py(mix[0])}" x2="${x0 + 28}" y2="${py(mix[0])}" stroke="#3288bd" stroke-width="2"/>`;
  const ym = (py(hom[0]) + py(mix[0])) / 2;
  o += `<text x="${x0 + 48}" y="${ym + 70}" font-family="Source Sans 3, system-ui, sans-serif" font-size="22" fill="#3288bd">same mean λ, less agreement:</text>`;
  o += `<text x="${x0 + 48}" y="${ym + 98}" font-family="Source Sans 3, system-ui, sans-serif" font-size="22" fill="#3288bd">${mix[0].toFixed(2)} vs ${hom[0].toFixed(2)}</text>`;
  $('mx-svg').innerHTML = o;
})();
</script></body></html>
